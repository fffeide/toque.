    <script>
      // Intercepta WebSockets de HMR (@vite/client) en el iframe de previsualización para evitar errores de conexión
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function SafeWebSocket(url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf(':24678') !== -1));
            if (isViteHmr) {
              return {
                readyState: 3,
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function () {},
                close: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
                dispatchEvent: function () { return true; }
              };
            }
            try {
              return protocols !== undefined
                ? new NativeWebSocket(url, protocols)
                : new NativeWebSocket(url);
            } catch (e) {
              return {
                readyState: 3,
                send: function () {},
                close: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
                dispatchEvent: function () { return true; }
              };
            }
          }
          SafeWebSocket.CONNECTING = 0;
          SafeWebSocket.OPEN = 1;
          SafeWebSocket.CLOSING = 2;
          SafeWebSocket.CLOSED = 3;
          SafeWebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket = SafeWebSocket;
        }
      })();
      window.addEventListener('error', function (e) {
        if (e && (e.filename?.includes('@vite/client') || (typeof e.message === 'string' && e.message.includes('WebSocket')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var str = String(e && e.reason);
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
